spring.application.name=backend-atlas
spring.datasource.url=jdbc:mysql://localhost:3307/atlas?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:atlas_super_secret_key_2026_muito_segura_com_mais_de_32_caracteres}
jwt.expiration=86400000


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

atlas.ai.base-url=${ATLAS_AI_BASE_URL:http://localhost:8000}
atlas.ai.detect-path=${ATLAS_AI_DETECT_PATH:/detect}
atlas.ai.connect-timeout-ms=${ATLAS_AI_CONNECT_TIMEOUT_MS:5000}
atlas.ai.read-timeout-ms=${ATLAS_AI_READ_TIMEOUT_MS:15000}

atlas.detection.min-confidence=${ATLAS_MIN_CONFIDENCE:0.35}
atlas.detection.max-image-size-bytes=${ATLAS_MAX_IMAGE_SIZE:5242880}
atlas.detection.default-image-width=${ATLAS_DEFAULT_IMG_WIDTH:640}
atlas.detection.default-image-height=${ATLAS_DEFAULT_IMG_HEIGHT:480}

# Vínculo PCD <-> Responsável
vinculo.codigo-tamanho=6
vinculo.codigo-validade-segundos=300
vinculo.max-geracoes-janela=5
vinculo.janela-geracao-minutos=10
vinculo.max-tentativas-falhas=5
vinculo.janela-tentativas-minutos=15
vinculo.codigo-segredo=${VINCULO_CODE_SECRET:${jwt.secret}}


# ---------------------------------------------------------------------------------------------------------------
# Endereços (Nominatim) e rotas (OSRM). Todas as URLs externas ficam aqui / em variáveis de ambiente.
# Política do Nominatim público: no máximo 1 req/s, User-Agent identificável, cache, sem autocomplete a cada tecla.
# ---------------------------------------------------------------------------------------------------------------
atlas.geo.attribution=${GEO_ATTRIBUTION:Dados © colaboradores do OpenStreetMap}

atlas.geo.nominatim.base-url=${NOMINATIM_BASE_URL:https://nominatim.openstreetmap.org}
atlas.geo.nominatim.user-agent=${NOMINATIM_USER_AGENT:WeSee-Backend/1.0}
# E-mail de contato da aplicação (a política do Nominatim pede um contato). Defina NOMINATIM_CONTACT_EMAIL.
atlas.geo.nominatim.contact-email=${NOMINATIM_CONTACT_EMAIL:}
atlas.geo.nominatim.country-codes=${NOMINATIM_COUNTRY_CODES:br}
atlas.geo.nominatim.language=${NOMINATIM_LANGUAGE:pt-BR}
atlas.geo.nominatim.min-interval-ms=${NOMINATIM_MIN_INTERVAL_MS:1100}
atlas.geo.nominatim.max-queue-wait-ms=${NOMINATIM_MAX_QUEUE_WAIT_MS:3000}
atlas.geo.nominatim.connect-timeout-ms=${NOMINATIM_CONNECT_TIMEOUT_MS:3000}
atlas.geo.nominatim.read-timeout-ms=${NOMINATIM_READ_TIMEOUT_MS:8000}
atlas.geo.nominatim.search-cache-ttl-seconds=${NOMINATIM_SEARCH_CACHE_TTL_SECONDS:21600}
atlas.geo.nominatim.reverse-cache-ttl-seconds=${NOMINATIM_REVERSE_CACHE_TTL_SECONDS:86400}
atlas.geo.nominatim.cache-max-entries=${NOMINATIM_CACHE_MAX_ENTRIES:2000}

# OSRM. ATENÇÃO: router.project-osrm.org só tem o grafo de CARRO (ignora foot/bike). O padrão abaixo aponta para a
# instância de pedestres do FOSSGIS (routing.openstreetmap.de), mas rotas a pé ficam DESLIGADAS até você confirmar
# (OSRM_WALKING_CONFIRMED=true) depois de rodar scripts/verify_osrm_profile.py. Servidor próprio com perfil foot:
#   OSRM_BASE_URL=https://seu-osrm  OSRM_ROUTE_PATH=/route/v1/foot
atlas.geo.osrm.base-url=${OSRM_BASE_URL:https://routing.openstreetmap.de}
atlas.geo.osrm.route-path=${OSRM_ROUTE_PATH:/routed-foot/route/v1/driving}
atlas.geo.osrm.profile-label=${OSRM_PROFILE_LABEL:foot}
atlas.geo.osrm.walking-confirmed=${OSRM_WALKING_CONFIRMED:false}
atlas.geo.osrm.allow-non-walking=${OSRM_ALLOW_NON_WALKING_DEMO:false}
atlas.geo.osrm.min-interval-ms=${OSRM_MIN_INTERVAL_MS:1100}
atlas.geo.osrm.max-queue-wait-ms=${OSRM_MAX_QUEUE_WAIT_MS:3000}
atlas.geo.osrm.connect-timeout-ms=${OSRM_CONNECT_TIMEOUT_MS:3000}
atlas.geo.osrm.read-timeout-ms=${OSRM_READ_TIMEOUT_MS:10000}
