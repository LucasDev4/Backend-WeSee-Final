spring.application.name=backend-atlas
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:atlas_super_secret_key_2026_muito_segura_com_mais_de_32_caracteres}
jwt.expiration=86400000


spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

atlas.ai.base-url=${ATLAS_AI_BASE_URL}
atlas.ai.detect-path=${ATLAS_AI_DETECT_PATH:/detect}
atlas.ai.connect-timeout-ms=${ATLAS_AI_CONNECT_TIMEOUT_MS:5000}
atlas.ai.read-timeout-ms=${ATLAS_AI_READ_TIMEOUT_MS:15000}

atlas.detection.min-confidence=${ATLAS_MIN_CONFIDENCE:0.35}
atlas.detection.max-image-size-bytes=${ATLAS_MAX_IMAGE_SIZE:5242880}
atlas.detection.default-image-width=${ATLAS_DEFAULT_IMG_WIDTH:640}
atlas.detection.default-image-height=${ATLAS_DEFAULT_IMG_HEIGHT:480}

# Vínculo PCD <-> Responsável
vinculo.codigo-tamanho=6
vinculo.codigo-validade-segundos=300
vinculo.max-geracoes-janela=5
vinculo.janela-geracao-minutos=10
vinculo.max-tentativas-falhas=5
vinculo.janela-tentativas-minutos=15
vinculo.codigo-segredo=${VINCULO_CODE_SECRET}
